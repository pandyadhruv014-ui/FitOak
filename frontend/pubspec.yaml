name: fitoak
description: "FitOak - AI-driven fitness and strength coach mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sensors_plus: ^6.0.0
  shared_preferences: 2.2.2
  permission_handler: ^11.3.1
  health: ^11.0.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/splash_background.png
    - assets/app_icon.png
    - assets/loading_icon.png
    - assets/icons/chest.png
    - assets/icons/biceps.png
    - assets/icons/triceps.png
    - assets/icons/shoulders.png
    - assets/icons/legs.png
    - assets/icons/back.png
    - assets/icons/abs.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21